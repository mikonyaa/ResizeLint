name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-26
          - ubuntu-22.04
          - macos-26-intel
          - ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Import official Swift signing keys
        if: runner.os == 'Linux'
        run: |
          keyring="$RUNNER_TEMP/resizelint-swift-gnupg"
          install -d -m 700 "$keyring"
          curl --fail --location --proto '=https' --tlsv1.2 --compressed --retry 3 \
            --silent --show-error https://www.swift.org/keys/all-keys.asc \
            --output "$RUNNER_TEMP/swift-signing-keys.asc"
          gpg --homedir "$keyring" --batch --import "$RUNNER_TEMP/swift-signing-keys.asc"
          echo "GNUPGHOME=$keyring" >> "$GITHUB_ENV"

      - name: Install Swift 6.3.3
        uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc
        with:
          swift-version: "6.3.3"

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build debug
        run: swift build

      - name: Run tests
        run: swift test

      - name: Build release
        run: swift build -c release

      - name: Verify SwiftLint
        if: startsWith(matrix.runner, 'macos')
        run: |
          archive="$RUNNER_TEMP/portable_swiftlint.zip"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --silent --show-error \
            https://github.com/realm/SwiftLint/releases/download/0.65.0/portable_swiftlint.zip \
            --output "$archive"
          printf '%s  %s\n' \
            d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6 \
            "$archive" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/swiftlint-0.65.0"
          ditto -x -k "$archive" "$RUNNER_TEMP/swiftlint-0.65.0"
          swiftlint="$RUNNER_TEMP/swiftlint-0.65.0/swiftlint"
          test "$("$swiftlint" version)" = "0.65.0"
          "$swiftlint" --strict

      - name: Test composite Action consumer
        run: Scripts/ci/test-action-consumer.sh .build/release/resizelint

      - name: Test Linux release packaging
        run: Scripts/ci/test-linux-release-script.sh

      - name: Test signing identity resolution
        run: Scripts/ci/test-signing-identity-resolution.sh

      - name: Test source release archive
        env:
          RESIZELINT_VERIFY_FORMULA_CHECKSUM: ${{ matrix.runner == 'macos-26' && '1' || '0' }}
        run: Scripts/release/test-source-archive.sh

      - name: Install machine verification dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/resizelint-verification"
          "$RUNNER_TEMP/resizelint-verification/bin/python" -m pip install -r Scripts/ci/requirements.txt
          echo "$RUNNER_TEMP/resizelint-verification/bin" >> "$GITHUB_PATH"

      - name: Test release candidate on production executable
        run: python3 Scripts/ci/test-release-candidate.py .build/release/resizelint

      - name: Validate machine contracts
        run: Scripts/ci/validate-machine-contracts.py

      - name: Check documentation links
        run: Scripts/ci/check-doc-links.sh

      - name: Check publication hygiene
        run: Scripts/ci/public-artifact-scan.sh

      - name: Test publication hygiene policy
        run: Scripts/ci/test-public-artifact-scan.sh

      - name: Run benchmark smoke test
        if: matrix.runner == 'macos-26' && github.event_name != 'pull_request'
        run: Scripts/benchmark/run.sh .build/release/resizelint 10000 5

      - name: Generate coverage data
        if: matrix.runner == 'macos-26' && github.event_name != 'pull_request'
        run: swift test --enable-code-coverage

      - name: Verify clean-room package
        if: matrix.runner == 'macos-26' && github.event_name != 'pull_request'
        run: Scripts/ci/clean-room.sh
